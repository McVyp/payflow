x-kafka-env: &kafka-env
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

x-kafka-image: &kafka-image confluentinc/cp-kafka:7.6.1

services:
  kafka1:
    image: *kafka-image
    container_name: kafka1
    networks:
      - kafka-net
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: "PLAINTEXT://kafka1:29092,CONTROLLER://kafka1:9093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092"
    ports:
      - "9092:9092"
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    image: *kafka-image
    container_name: kafka2
    networks:
      - kafka-net
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: "PLAINTEXT://kafka2:29092,CONTROLLER://kafka2:9093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://localhost:9094"
    ports:
      - "9094:9092"
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    image: *kafka-image
    container_name: kafka3
    networks:
      - kafka-net
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: "PLAINTEXT://kafka3:29092,CONTROLLER://kafka3:9093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka3:29092,PLAINTEXT_HOST://localhost:9096"
    ports:
      - "9096:9092"
    volumes:
      - kafka3-data:/var/lib/kafka/data

  kafka-init:
    image: *kafka-image
    container_name: kafka-init
    networks:
      - kafka-net
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      set -e;
      echo 'Waiting for Kafka brokers...';
      cub kafka-ready -b kafka1:29092,kafka2:29092,kafka3:29092 3 60;
      kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic payment-events --partitions 4 --replication-factor 3;
      echo 'Topic created.';
      "
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks:
      - kafka-net
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  producer:
    build: ./services/producer
    container_name: producer
    networks:
      - kafka-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: "kafka1:29092,kafka2:29092,kafka3:29092"
    ports:
      - "4000:4000"

  consumer:
    build: ./services/consumer
    container_name: consumer
    networks:
      - kafka-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    environment:
      KAFKA_BROKERS: "kafka1:29092,kafka2:29092,kafka3:29092"
      DATABASE_URL: "postgres://payments:payments@postgres:5432/payments"
    ports:
      - "4001:4001"

  frontend:
    build: ./frontend
    container_name: frontend
    networks:
      - kafka-net
    depends_on:
      - producer
      - consumer
    ports:
      - "5173:5173"
    environment:
      VITE_PRODUCER_URL: "http://localhost:4000"
      VITE_CONSUMER_URL: "http://localhost:4001"

networks:
  kafka-net:
    driver: bridge

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  pg-data: